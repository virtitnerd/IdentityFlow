name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-artifacts:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore IdentityFlow.slnx

      - name: Test
        run: dotnet test IdentityFlow.slnx --configuration Release

      - name: Publish Function App
        run: dotnet publish src/IdentityFlow.Functions/IdentityFlow.Functions.csproj --configuration Release --output publish/functions --no-self-contained

      - name: Publish Web App
        run: dotnet publish src/IdentityFlow.Web/IdentityFlow.Web.csproj --configuration Release --output publish/web --no-self-contained

      - name: Zip artifacts
        run: |
          (cd publish/functions && zip -r "$GITHUB_WORKSPACE/IdentityFlow.Functions-${{ github.event.release.tag_name }}.zip" .)
          (cd publish/web && zip -r "$GITHUB_WORKSPACE/IdentityFlow.Web-${{ github.event.release.tag_name }}.zip" .)

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "IdentityFlow.Functions-${{ github.event.release.tag_name }}.zip" \
            "IdentityFlow.Web-${{ github.event.release.tag_name }}.zip" \
            --clobber
