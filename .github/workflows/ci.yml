name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore IdentityFlow.slnx

      - name: Build (${{ matrix.configuration }})
        run: dotnet build IdentityFlow.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Test (${{ matrix.configuration }})
        run: dotnet test IdentityFlow.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal
