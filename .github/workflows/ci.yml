name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore IdentityFlow.slnx

      - name: Build (${{ matrix.configuration }})
        run: dotnet build IdentityFlow.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Test (${{ matrix.configuration }})
        run: dotnet test IdentityFlow.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal
