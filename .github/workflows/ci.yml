name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & test (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PaycomEntraProvisioner.slnx

      - name: Build (${{ matrix.configuration }})
        run: dotnet build PaycomEntraProvisioner.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Test (${{ matrix.configuration }})
        run: dotnet test PaycomEntraProvisioner.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal
