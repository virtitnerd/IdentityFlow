# .NET's nearest equivalent to ruff check/format -- `dotnet format` runs the
# same Roslyn analyzers/formatter the SDK already applies, `--verify-no-changes`
# fails the job instead of writing changes, matching how ci lint jobs in this
# org's other repos gate on format rather than auto-fix in CI.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

permissions: {}

jobs:
  format:
    name: dotnet format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting
        run: dotnet format IdentityFlow.slnx --verify-no-changes --verbosity diagnostic
