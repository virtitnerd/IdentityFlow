# .NET's nearest equivalent to ruff check/format -- `dotnet format` runs the
# same Roslyn analyzers/formatter the SDK already applies, `--verify-no-changes`
# fails the job instead of writing changes, matching how ci lint jobs in this
# org's other repos gate on format rather than auto-fix in CI.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

permissions: {}

jobs:
  format:
    name: dotnet format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting
        run: dotnet format IdentityFlow.slnx --verify-no-changes --verbosity diagnostic
